name: Build Installers

# Builds installable files for every platform and attaches them to a GitHub Release.
# Trigger: push a tag like "v1.0.0", or run manually from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Android SDK is preinstalled on ubuntu-latest (ANDROID_HOME is already set)
      - run: npm ci
      - run: node sync-web.js && npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk ZinoxCalc-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ZinoxCalc-Android.apk

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node sync-web.js && npx electron-builder --win nsis portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*.exe

  macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node sync-web.js && npx electron-builder --mac dmg --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release/*.dmg

  ios:
    name: iOS (unsigned IPA)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node sync-web.js && npx cap sync ios
      - name: Build unsigned app
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr ZinoxCalc-iOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: ZinoxCalc-iOS-unsigned.ipa

  release:
    name: Publish Release
    needs: [android, windows, macos, ios]
    if: always() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: ZinoxCalc ${{ github.ref_name }}
          files: dist/*
          body: |
            ## ZinoxCalc Installers — Powered by Dabeltech
            | Platform | File |
            |---|---|
            | Windows (installer) | `ZinoxCalc-Setup-*.exe` |
            | Windows (no install) | `ZinoxCalc-Portable-*.exe` |
            | macOS (Intel & Apple Silicon) | `ZinoxCalc-*-mac-*.dmg` |
            | Android | `ZinoxCalc-Android.apk` |
            | iPhone / iPad | `ZinoxCalc-iOS-unsigned.ipa` (needs sideloading or re-signing) |
